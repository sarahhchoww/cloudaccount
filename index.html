<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cloud Access</title>

  <style>
    :root {
      --max-width: 420px;
      --page-padding: 16px;
      --topbar-height: 56px;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #ffffff;
      color: #0f1a4a;
      min-height: 100vh;
      -webkit-font-smoothing:antialiased;
    }

    /* Top menu bar */
    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--topbar-height);
      display: flex;
      align-items: center;
      padding: 0 14px;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(6px);
      z-index: 1000;
      box-shadow: 0 1px 0 rgba(15,26,74,0.08) inset;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      color: #0f1a4a;
    }

    .logo svg {
      width: 28px;
      height: 28px;
      display: block;
      flex: 0 0 28px;
    }

    .brand {
      font-size: 16px;
      letter-spacing: 0.2px;
    }

    /* Page wrapper - mobile-first */
    .page {
      width: 100%;
      max-width: var(--max-width);
      margin: 0 auto;
      padding: calc(var(--topbar-height) + var(--page-padding)) var(--page-padding) var(--page-padding);
      box-sizing: border-box;
      text-align: center;
    }

    /* Center the login box on the landing page (accounting for topbar) */
    #loginPage {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - var(--topbar-height));
      padding-top: calc(var(--topbar-height) + var(--page-padding));
      padding-bottom: var(--page-padding);
      box-sizing: border-box;
    }

    .box {
      background: #f5f8ff;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
      text-align: left;
    }

    .password-row {
      position: relative;
      margin-top: 12px;
    }

    .password-row input {
      width: 100%;
      padding-right: 46px;
    }

    .password-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: auto;
      border: none;
      background: transparent;
      padding: 6px;
      cursor: pointer;
      color: #0f1a4a;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .password-toggle:hover {
      color: inherit;
      background: transparent;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 10px;
      background: #0f1a4a;
      color: #ffffff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #152a70;
    }

    .error {
      color: #f87171;
      margin-top: 10px;
      display: none;
    }

    #cloudPage {
      display: none;
    }

    /* Image on the cloud page should not be inside a box/container */
    .photo {
      width: 100%;
      height: auto;
      border-radius: 6px;
      margin: 8px 0 0 0;
      display: block;
      object-fit: cover;
    }

    .caption {
      margin-top: 10px;
      font-size: 15px;
      color: #3b4f8a;
      text-align: left;
    }

    .page-title {
      margin: 0 0 8px 0;
      font-size: 28px;
      font-weight: 700;
      text-align: left;
      color: #0f1a4a;
    }

    /* Smaller screens tweaks */
    @media (max-width: 420px) {
      .box { padding: 16px; border-radius: 12px; }
      .brand { display: none; }
    }
  </style>
</head>

<body>

  <!-- Top menu bar with cloud logo -->
  <header class="topbar">
    <div class="logo">
      <!-- Simple inline cloud SVG -->
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M20 17.58A4.42 4.42 0 0 0 15.58 13H15a5 5 0 0 0-9.9 1A3.5 3.5 0 0 0 3.5 18.5H20z" fill="#1f3f87"/>
      </svg>
      <span class="brand">Cloud</span>
    </div>
  </header>

  <!-- Landing Page -->
  <div id="loginPage" class="page">
    <div class="box">
      <h1>你好，鄭凱峯</h1>
      <p>輸入密碼以存取雲端儲存中的受保護檔案。</p>

      <div class="password-row">
        <input type="password" id="passwordInput" placeholder="密碼" onblur="handlePasswordBlur()" />
        <button type="button" id="togglePassword" class="password-toggle" aria-label="Show password" onclick="togglePasswordVisibility()">
          <img id="passwordIcon" src="image/eye.png" alt="Show password" width="20" height="20" />
        </button>
      </div>
      <button onclick="checkPassword()">登入</button>

      <div id="errorMessage" class="error">密碼錯誤</div>
    </div>
  </div>

  <!-- Cloud Page -->
  <div id="cloudPage" class="page">
    <!-- Heading without the boxed container -->
    <h1 class="page-title">雲端檔案</h1>

    <!-- Image is intentionally not inside a boxed frame so it appears without the boxed frame -->
    <img src="image/stealingcat.png" alt="Cloud evidence photo" class="photo" />

    <div class="caption">
      檔案上傳於2098年9月21日，晚上10:47。
      希望件事唔係我諗嘅咁啦。。。
    </div>
  </div>

  <script>
    const correctPassword = "1234";
    let revealTimeout;

    function setPasswordIcon(isVisible) {
      const toggleButton = document.getElementById('togglePassword');
      const icon = document.getElementById('passwordIcon');
      icon.src = isVisible ? 'image/eye-off.png' : 'image/eye.png';
      icon.alt = isVisible ? 'Hide password' : 'Show password';
      toggleButton.setAttribute('aria-label', isVisible ? 'Hide password' : 'Show password');
    }

    function togglePasswordVisibility() {
      const passwordInput = document.getElementById('passwordInput');
      const isHidden = passwordInput.type === 'password';

      if (isHidden) {
        passwordInput.type = 'text';
        setPasswordIcon(true);
        clearTimeout(revealTimeout);
        revealTimeout = setTimeout(() => {
          passwordInput.type = 'password';
          setPasswordIcon(false);
        }, 3000);
      } else {
        passwordInput.type = 'password';
        setPasswordIcon(false);
        clearTimeout(revealTimeout);
      }
    }

    function handlePasswordBlur() {
      const passwordInput = document.getElementById('passwordInput');
      if (passwordInput.type === 'text') {
        passwordInput.type = 'password';
        setPasswordIcon(false);
        clearTimeout(revealTimeout);
      }
    }

    function checkPassword() {
      const input = document.getElementById("passwordInput").value;
      const error = document.getElementById("errorMessage");

      if (input === correctPassword) {
        document.getElementById("loginPage").style.display = "none";
        document.getElementById("cloudPage").style.display = "block";
        window.scrollTo({top:0,behavior:'smooth'});
      } else {
        error.style.display = "block";
      }
    }
  </script>

</body>
</html>
