<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cloud Access</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .page {
      width: 90%;
      max-width: 420px;
      text-align: center;
    }

    .box {
      background: rgba(255, 255, 255, 0.08);
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.4);
    }

    input {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: none;
      border-radius: 10px;
      background: #38bdf8;
      color: #020617;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #7dd3fc;
    }

    .error {
      color: #f87171;
      margin-top: 12px;
      display: none;
    }

    #cloudPage {
      display: none;
    }

    .photo {
      width: 100%;
      border-radius: 14px;
      margin-top: 20px;
    }

    .caption {
      margin-top: 12px;
      font-size: 15px;
      color: #cbd5e1;
    }
  </style>
</head>

<body>

  <!-- Landing Page -->
  <div id="loginPage" class="page">
    <div class="box">
      <h1>Cloud Storage</h1>
      <p>Enter password to access protected files.</p>

      <input type="password" id="passwordInput" placeholder="Password" />
      <button onclick="checkPassword()">Enter</button>

      <div id="errorMessage" class="error">Incorrect password</div>
    </div>
  </div>

  <!-- Cloud Page -->
  <div id="cloudPage" class="page">
    <div class="box">
      <h1>Recovered Cloud File</h1>

      <img 
        src="your-photo.jpg" 
        alt="Cloud evidence photo" 
        class="photo"
      />

      <div class="caption">
        File uploaded on 14 May, 11:47 PM.  
        The image appears to show the suspect near the storage room entrance.
      </div>
    </div>
  </div>

  <script>
    const correctPassword = "detective123";

    function checkPassword() {
      const input = document.getElementById("passwordInput").value;
      const error = document.getElementById("errorMessage");

      if (input === correctPassword) {
        document.getElementById("loginPage").style.display = "none";
        document.getElementById("cloudPage").style.display = "block";
      } else {
        error.style.display = "block";
      }
    }
  </script>

</body>
</html>
