<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cloud Access</title>

  <style>
    :root {
      --max-width: 420px;
      --page-padding: 16px;
      --topbar-height: 56px;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
      min-height: 100vh;
      -webkit-font-smoothing:antialiased;
    }

    /* Top menu bar */
    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--topbar-height);
      display: flex;
      align-items: center;
      padding: 0 14px;
      background: rgba(2,6,23,0.45);
      backdrop-filter: blur(6px);
      z-index: 1000;
      box-shadow: 0 1px 0 rgba(255,255,255,0.03) inset;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      color: #e6eef8;
    }

    .logo svg {
      width: 28px;
      height: 28px;
      display: block;
      flex: 0 0 28px;
    }

    .brand {
      font-size: 16px;
      letter-spacing: 0.2px;
    }

    /* Page wrapper - mobile-first */
    .page {
      width: 100%;
      max-width: var(--max-width);
      margin: 0 auto;
      padding: calc(var(--topbar-height) + var(--page-padding)) var(--page-padding) var(--page-padding);
      box-sizing: border-box;
      text-align: center;
    }

    /* Center the login box on the landing page (accounting for topbar) */
    #loginPage {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - var(--topbar-height));
      padding-top: calc(var(--topbar-height) + var(--page-padding));
      padding-bottom: var(--page-padding);
      box-sizing: border-box;
    }

    .box {
      background: rgba(255, 255, 255, 0.06);
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
      text-align: left;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 10px;
      background: #38bdf8;
      color: #020617;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #7dd3fc;
    }

    .error {
      color: #f87171;
      margin-top: 10px;
      display: none;
    }

    #cloudPage {
      display: none;
    }

    /* Image on the cloud page should not be inside a box/container */
    .photo {
      width: 100%;
      height: auto;
      border-radius: 6px;
      margin: 8px 0 0 0;
      display: block;
      object-fit: cover;
    }

    .caption {
      margin-top: 10px;
      font-size: 15px;
      color: #cbd5e1;
      text-align: left;
    }

    /* Smaller screens tweaks */
    @media (max-width: 420px) {
      .box { padding: 16px; border-radius: 12px; }
      .brand { display: none; }
    }
  </style>
</head>

<body>

  <!-- Top menu bar with cloud logo -->
  <header class="topbar">
    <div class="logo">
      <!-- Simple inline cloud SVG -->
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M20 17.58A4.42 4.42 0 0 0 15.58 13H15a5 5 0 0 0-9.9 1A3.5 3.5 0 0 0 3.5 18.5H20z" fill="#e6eef8"/>
      </svg>
      <span class="brand">Cloud</span>
    </div>
  </header>

  <!-- Landing Page -->
  <div id="loginPage" class="page">
    <div class="box">
      <h1>你好，鄭凱峯</h1>
      <p>輸入密碼以存取雲端儲存中的受保護檔案。</p>

      <input type="password" id="passwordInput" placeholder="密碼" />
      <button onclick="checkPassword()">登入</button>

      <div id="errorMessage" class="error">密碼錯誤</div>
    </div>
  </div>

  <!-- Cloud Page -->
  <div id="cloudPage" class="page">
    <!-- Keep the heading in a subtle box but remove the image from that container -->
    <div class="box">
      <h1>雲端檔案</h1>
    </div>

    <!-- Image is intentionally not inside the .box container so it appears without the boxed frame -->
    <img src="image/stealingcat.png" alt="Cloud evidence photo" class="photo" />

    <div class="caption">
      檔案上傳於2098年9月21日，晚上10:47。
      希望件事唔係我諗嘅咁啦。。。
    </div>
  </div>

  <script>
    const correctPassword = "detective123";

    function checkPassword() {
      const input = document.getElementById("passwordInput").value;
      const error = document.getElementById("errorMessage");

      if (input === correctPassword) {
        document.getElementById("loginPage").style.display = "none";
        document.getElementById("cloudPage").style.display = "block";
        window.scrollTo({top:0,behavior:'smooth'});
      } else {
        error.style.display = "block";
      }
    }
  </script>

</body>
</html>
